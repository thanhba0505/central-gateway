services:
  - type: web
    name: central-gateway-server
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter central-gateway-server prisma:generate && pnpm --filter central-gateway-server build
    startCommand: pnpm --filter central-gateway-server prisma:deploy && pnpm --filter central-gateway-server start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_SECRET_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
